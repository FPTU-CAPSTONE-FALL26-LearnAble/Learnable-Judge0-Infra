x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-judge0: &judge0
  image: judge0/judge0:1.13.1@sha256:6b5d6a66aa19a8e878a52ea3c6a560afc1086734d96e2885b561fd5c6018f082
  platform: linux/amd64
  # Required for both services by the official v1.13.1 deployment archive.
  privileged: true
  restart: unless-stopped
  logging: *logging
  volumes:
    - type: bind
      source: ${JUDGE0_CONFIG:?Set JUDGE0_CONFIG to an existing secret config}
      target: /judge0.conf
      read_only: true
      bind:
        create_host_path: false
    - ./scripts/container-start.sh:/infra/start.sh:ro
    - ./scripts/api-health.rb:/infra/health.rb:ro
  networks: [data]

services:
  server:
    <<: *judge0
    command: ["/bin/bash", "/infra/start.sh", "/api/scripts/server"]
    ports: ["127.0.0.1:2358:2358"]
    cpus: ${API_CPUS:-0.50}
    mem_limit: ${API_MEMORY:-512m}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "/infra/health.rb"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  workers:
    <<: *judge0
    command: ["/bin/bash", "/infra/start.sh", "/api/scripts/workers"]
    cpus: ${WORKER_CPUS:-1.0}
    mem_limit: ${WORKER_MEMORY:-768m}
    stop_grace_period: 60s
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16.16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca
    restart: unless-stopped
    logging: *logging
    env_file: ${JUDGE0_CONFIG:?Set JUDGE0_CONFIG}
    cpus: ${DB_CPUS:-0.50}
    mem_limit: ${DB_MEMORY:-384m}
    networks: [data]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.17-bookworm@sha256:5b816bb37d9707a70f10ef5002ecf8ee431750d397010fc4314c93dca887962f
    restart: unless-stopped
    logging: *logging
    env_file: ${JUDGE0_CONFIG:?Set JUDGE0_CONFIG}
    command: ["bash", "-c", 'exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 64mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    cpus: ${REDIS_CPUS:-0.25}
    mem_limit: ${REDIS_MEMORY:-128m}
    networks: [data]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  proxy:
    image: nginx:1.30.6@sha256:42c68eab6f7e22611786a9fe1d1c019e275c50185bd54b8f75dc2b9184322703
    profiles: [https]
    # Linux host networking allows upstream access to the localhost-only API.
    network_mode: host
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${TLS_DIR:?Set TLS_DIR for the https profile}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      server:
        condition: service_healthy

networks:
  data:
    internal: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:?Set an inspected POSTGRES_VOLUME}
  redis-data:
    name: ${REDIS_VOLUME:?Set an inspected REDIS_VOLUME}
