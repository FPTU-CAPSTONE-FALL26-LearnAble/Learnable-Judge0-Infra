worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 256; }
http {
    # Exclude query strings and authentication headers from access logs.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=backend:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 256k;
        client_body_timeout 10s;
        limit_req zone=backend burst=10 nodelay;
        limit_req_status 429;
        limit_conn connections 10;
        location / {
            # Require header authentication at the edge as well as in Judge0.
            if ($http_x_auth_token = "") { return 401; }
            if ($args ~* "(^|&)X[-_]Auth[-_]Token=") { return 400; }
            proxy_pass http://127.0.0.1:2358;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
    }
}
